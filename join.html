<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css"
    rel="stylesheet"
>    <link rel="stylesheet" href="style.css">

    
</head>
<body>


  <main class="signup-container">
    <h1>회원가입</h1>
    <p class="description">
      회원 정보를 입력하고 가입을 완료해주세요.
    </p>

    <form action="#" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="userId">아이디</label>
        <input type="text" id="userId" name="userId" required>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="birth">생년월일</label>
        <input type="date" id="birth" name="birth" required>
      </div>

      <div class="form-group">
        <label for="profile">프로필 사진</label>
        <input type="file" id="profile" name="profile"
               accept="image/*">
      </div>

      <div class="form-group">
        <label for="age">나이</label>
        <input type="number" id="age" name="age" min="1" max="120"
               required>
      </div>

      <div class="form-group">
        <label for="interest">관심 분야</label>
        <select id="interest" name="interest" required>
          <option value="movie">영화</option>
          <option value="music">음악</option>
          <option value="travel">여행</option>
          <option value="sports">스포츠</option>
          <option value="reading">독서</option>
        </select>
      </div>

      <fieldset class="form-group gender-group">
        <legend>성별</legend>
        <label>
          <input type="radio" name="gender" value="male">
          남성
        </label>
        <label>
          <input type="radio" name="gender" value="female">
          여성
        </label>
        <label>
          <input type="radio" name="gender" value="none">
          선택 안 함
        </label>
      </fieldset>

      <fieldset class="form-group agreement-group">
        <legend>약관에 동의하시나요?</legend>
        <label>
          <input type="checkbox" name="terms" value="agree" required>
          이용약관 동의
        </label>
        <label>
          <input type="checkbox" name="marketing" value="agree">
          마케팅 정보 수신 동의
        </label>
      </fieldset>

      <div class="button-group">
        <button type="submit">회원가입</button>
        <button type="reset">초기화</button>
        <button type="button" onclick="history.back()">취소</button>
      </div>
    </form>
  </main>
<a href="index.html">홈으로</a>

</body>
</html>
